kind = "web"
previewPath = "/"
title = "Fanta MotoGP"
description = "Il Fanta MotoGP tra amici: pronostici, storico GP, classifiche di lega, record e impostazioni. Progettato prima per smartphone."
version = "1.0.0"
id = "artifacts/my-first-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21367

[services.development]
run = "pnpm --filter @workspace/my-first-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/my-first-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/my-first-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21367"
BASE_PATH = "/"
