name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Add Capacitor
        working-directory: artifacts/my-first-app
        run: |
          pnpm add @capacitor/core@^8.0.0 @capacitor/android@^8.0.0
          pnpm add -D @capacitor/cli@^8.0.0

      - name: Create Capacitor config
        working-directory: artifacts/my-first-app
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.lisalucci.fantamotogp',
            appName: 'FantaMotoGP',
            webDir: 'dist',
            server: {
              androidScheme: 'https',
            },
          };

          export default config;
          EOF

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm --filter @workspace/my-first-app build

      - name: Add Android platform
        working-directory: artifacts/my-first-app
        run: pnpm exec cap add android

      - name: Sync Capacitor
        working-directory: artifacts/my-first-app
        run: pnpm exec cap sync android

      - name: Build debug APK
        working-directory: artifacts/my-first-app/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FantaMotoGP-APK
          path: artifacts/my-first-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
